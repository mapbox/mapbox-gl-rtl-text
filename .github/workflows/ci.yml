name: CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  EM_VERSION: 6.0.10

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    # caches emsdk together with the ICU port it builds on first use
    - uses: actions/cache@v6
      with:
        path: emsdk
        key: emsdk-${{ env.EM_VERSION }}-${{ runner.os }}
    # emsdk_env.sh would also put emsdk's own node first on PATH, so only add emcc
    - name: Install emsdk
      run: |
        [ -d emsdk ] || git clone --depth 1 --branch $EM_VERSION https://github.com/emscripten-core/emsdk.git
        emsdk/emsdk install $EM_VERSION
        emsdk/emsdk activate $EM_VERSION
        echo "EM_CONFIG=$PWD/emsdk/.emscripten" >> $GITHUB_ENV
        echo "$PWD/emsdk/upstream/emscripten" >> $GITHUB_PATH
    - run: emcc --version
    - run: npm ci
    - run: npm test
