name: CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  EM_VERSION: 6.0.10

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    # the same sources and emcc version build a byte-identical wasm, so most runs can skip emsdk entirely
    - uses: actions/cache@v6
      id: wasm
      with:
        path: dist/mapbox-gl-rtl-text.wasm
        key: wasm-${{ env.EM_VERSION }}-${{ hashFiles('src/*.c', 'Makefile') }}
    # the restored wasm is older than the checked-out sources, so mark it up to date for make
    - if: steps.wasm.outputs.cache-hit == 'true'
      run: touch dist/mapbox-gl-rtl-text.wasm
    # installs only the toolchain, without the SDK's bundled node, so emcc uses node from PATH
    - name: Install emsdk
      if: steps.wasm.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch $EM_VERSION https://github.com/emscripten-core/emsdk.git
        emsdk/emsdk install releases-$EM_VERSION-64bit
        emsdk/emsdk activate releases-$EM_VERSION-64bit
        echo "EM_CONFIG=$PWD/emsdk/.emscripten" >> $GITHUB_ENV
        echo "$PWD/emsdk/upstream/emscripten" >> $GITHUB_PATH
    - if: steps.wasm.outputs.cache-hit != 'true'
      run: emcc --version
    - run: npm ci
    - run: npm test
